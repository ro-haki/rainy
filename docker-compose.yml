services:
  agent:
    # The Dockerfile builds from the Gradle-staged context, so run
    #   ./gradlew dockerContext      (or: ./gradlew buildImage)
    # before `docker compose up --build`.
    build:
      context: ./build/docker
    image: rainy-agent:1.0-SNAPSHOT
    env_file:
      - .env
    cap_add:
      - NET_RAW    # raw sockets for nmap/masscan/rustscan
      - NET_ADMIN
    volumes:
      # Edit skills without rebuilding the image.
      - ./skills:/app/skills:ro
      # Persist per-run tool-call jsonl logs on the host.
      - ./logs:/app/logs
      # Override config without rebuilding: `cp agent.example.yaml agent.yml`, then uncomment.
      # - ./agent.yml:/app/agent.yml:ro
