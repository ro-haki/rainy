name: rustscan
toolName: rustscan_scan
executable: rustscan
description: >-
  Run rustscan, a very fast port scanner, and return its raw output. 'target' is a host, IP or
  CIDR (space-separate several). 'arguments' are raw rustscan flags; use '-g' for greppable
  open-ports-only output, or append '-- <nmap args>' to pipe results into nmap.
  Only scan hosts the user is authorized to scan.
targetFlag: "-a"
defaultArguments:
  - "--ulimit"
  - "5000"
argumentExamples:
  - "-g"
  - "-r 1-65535 -g"
  - "--range 1-1000 -- -sV"
defaultTimeoutSeconds: 300
maxTimeoutSeconds: 3600
