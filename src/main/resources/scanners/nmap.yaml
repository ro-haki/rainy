name: nmap
toolName: nmap_scan
executable: nmap
description: >-
  Run an nmap scan and return its raw output. 'target' is a host, IP, hostname or CIDR
  (space-separate several). 'options' are raw nmap flags, e.g. '-sV -p 1-1000'.
  Only scan hosts the user is authorized to scan.
defaultArguments: []
optionExamples:
  - "-sV -p 1-1000"
  - "-A -T4 -Pn"
  - "-p- -sS"
defaultTimeoutSeconds: 300
maxTimeoutSeconds: 3600
